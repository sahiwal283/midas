# Local development override — adds a local Postgres container.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Production (Proxmox) uses CT 3220 (192.168.1.211) as the database.
# DATABASE_URL in .env must point to CT 3220 for production; this file
# overrides it to use the local db service for local dev.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-midas}
      POSTGRES_USER: ${POSTGRES_USER:-midas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midas_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midas} -d ${POSTGRES_DB:-midas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-midas}:${POSTGRES_PASSWORD:-midas_dev}@db:5432/${POSTGRES_DB:-midas}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
