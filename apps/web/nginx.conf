server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Receipt photos from phone cameras are 2–10 MB; nginx's 1 MB default
    # rejected them with 413 before they ever reached the API. The API's own
    # multer limit (10 MB) is the real gate — this just has to stay above it.
    client_max_body_size 25m;

    # Proxy API requests to the API service (same Docker Compose network)
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Must exceed the API's sync-OCR budget (OCR_TIMEOUT_MS = 120s).
        proxy_read_timeout 130s;
    }

    # Proxy uploaded receipt files
    location /uploads/ {
        proxy_pass http://api:4000;
    }

    # SPA fallback — all app routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
