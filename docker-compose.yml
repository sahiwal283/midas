services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    # SQL migrations replace db:push at boot: drizzle-kit push cannot introspect
    # the budgets expression index (0015), and the runner is idempotent.
    command: sh -c "npx tsx src/db/runSqlMigrations.ts && npm run db:seed && npm run dev"
    env_file: .env
    environment:
      PORT: "4000"
      NODE_ENV: development
    volumes:
      # Seed/dev scripts use `tsx --env-file=../../.env` (resolves to /app/.env).
      - ./.env:/app/.env:ro
      - ./apps/api/src:/app/apps/api/src:delegated
      - ./packages:/app/packages:delegated
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  # The canonical OCR engine (see services/ocr-engine/README.md). Not started by default —
  # only needed when OCR_MODE=service. Local/dev defaults to free, local-only providers
  # (rapidocr + tesseract); never enable document_ai/google_vision outside production.
  ocr-engine:
    build:
      context: ./services/ocr-engine
    restart: unless-stopped
    env_file:
      - path: ./services/ocr-engine/.env
        required: false
    profiles:
      - ocr
    ports:
      - "8001:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://api:4000
    volumes:
      - ./apps/web/src:/app/apps/web/src:delegated
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  uploads:
