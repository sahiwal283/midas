services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "4000"
      NODE_ENV: development
    volumes:
      - ./apps/api/src:/app/apps/api/src:delegated
      - ./packages:/app/packages:delegated
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://api:4000
    volumes:
      - ./apps/web/src:/app/apps/web/src:delegated
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  uploads:
