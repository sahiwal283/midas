services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    # SQL migrations replace db:push at boot: drizzle-kit push cannot introspect
    # the budgets expression index (0015), and the runner is idempotent.
    command: sh -c "npx tsx src/db/runSqlMigrations.ts && npm run db:seed && npm run dev"
    env_file: .env
    environment:
      PORT: "4000"
      NODE_ENV: development
    volumes:
      # Seed/dev scripts use `tsx --env-file=../../.env` (resolves to /app/.env).
      - ./.env:/app/.env:ro
      - ./apps/api/src:/app/apps/api/src:delegated
      - ./packages:/app/packages:delegated
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  # The canonical OCR engine now lives in its own repo (~/Work/services/ocrService,
  # v0.17.0+) — Midas no longer vendors the Python source. Not started by default —
  # only needed when OCR_MODE=service and you want a local container instead of the
  # LAN service. Three ways to get OCR locally:
  #   1. OCR_MODE=mock (default for offline tests/CI — no network calls at all)
  #   2. OCR_BASE_URL=http://192.168.1.195:8000 (live LAN service — no image needed)
  #   3. Build the image locally, then `docker compose --profile ocr up -d ocr-engine`:
  #        cd ~/Work/services/ocrService && make ui-build && docker build -t ocr-service:0.17.0 .
  #      Local/dev env should use free, local-only providers (rapidocr + tesseract);
  #      never enable document_ai/google_vision outside production.
  ocr-engine:
    image: ocr-service:0.17.0
    restart: unless-stopped
    env_file:
      - path: ./.env.ocr-engine
        required: false
    profiles:
      - ocr
    ports:
      - "8001:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://api:4000
    volumes:
      - ./apps/web/src:/app/apps/web/src:delegated
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  uploads:
