# Production override for Proxmox deployment.
# External DB is in midas-db-prod (192.168.1.211).
# Run migrations first: docker compose -f docker-compose.prod.yml run --rm --build migrator
# Then start: docker compose -f docker-compose.prod.yml up -d api web

services:

  # One-shot migration runner — uses build stage (has drizzle-kit).
  # Run once on first deploy and after schema changes:
  #   docker compose -f docker-compose.prod.yml run --rm --build migrator
  migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file: .env
    restart: "no"
    # Calls the entrypoints directly rather than `npm run db:migrate:sql` /
    # `db:seed`. Those scripts pass `tsx --env-file=../../.env`, which is right
    # for a laptop but wrong here: `env_file:` above injects the variables into
    # the process, it does not put a file at /app/.env — so the npm path dies
    # with `node: ../../.env: not found` before touching the database. That is
    # why migrations were being applied by hand via psql. WORKDIR is already
    # /app/apps/api, so these paths are relative to it.
    command: sh -c "npx tsx src/db/runSqlMigrations.ts && npx tsx src/db/seed.ts"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    restart: always
    env_file: .env
    volumes:
      - /opt/midas/uploads:/app/uploads
    ports:
      - "4000:4000"
    healthcheck:
      # 127.0.0.1, not localhost: the container resolves localhost to ::1 and
      # the API listens on IPv4 only, so the check would always fail.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    restart: always
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
